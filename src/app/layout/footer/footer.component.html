<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__brand">
      <span class="brand__mark">BP</span>
      <div>
        <p class="site-footer__name">{{ profile.name }}</p>
        <p class="site-footer__title">{{ profile.title }}</p>
      </div>
    </div>

    <nav aria-label="Footer">
      <ul class="site-footer__links">
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <ul class="site-footer__socials" aria-label="Social links">
      @for (social of socials; track social.url) {
        <li>
          <a [href]="social.url" target="_blank" rel="noopener noreferrer" [attr.aria-label]="social.label">
            <app-social-icon [icon]="social.icon" />
          </a>
        </li>
      }
    </ul>
  </div>

  <div class="container">
    <p class="site-footer__copyright">© {{ year }} {{ profile.name }}. All rights reserved.</p>
  </div>
</footer>

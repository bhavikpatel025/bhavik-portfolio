<header class="site-header" [class.is-scrolled]="isScrolled()">
  <div class="container site-header__inner">
    <a href="#top" class="brand" aria-label="Bhavik Patel — home">
      <span class="brand__mark">BP</span>
      <span class="brand__name">Bhavik Patel</span>
    </a>

    <nav class="nav-desktop" aria-label="Primary">
      <ul>
        @for (link of navLinks; track link.href) {
          <li><a [href]="link.href">{{ link.label }}</a></li>
        }
      </ul>
    </nav>

    <div class="header-actions">
      <button
        type="button"
        class="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.6" />
            <path stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
              d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M20.4 14.7A8.5 8.5 0 1 1 9.3 3.6a7 7 0 0 0 11.1 11.1Z" />
          </svg>
        }
      </button>

      <a class="btn btn--ghost header-actions__resume" [href]="resumePath" download>Resume</a>

      <button
        type="button"
        class="menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="mobile-nav"
        aria-label="Toggle navigation menu"
      >
        <span [class.is-open]="isMenuOpen()"></span>
      </button>
    </div>
  </div>

  <div class="mobile-nav" id="mobile-nav" [class.is-open]="isMenuOpen()" role="dialog" aria-modal="true" aria-label="Navigation menu">
    <nav aria-label="Mobile primary">
      <ul>
        @for (link of navLinks; track link.href) {
          <li><a [href]="link.href" (click)="closeMenu()">{{ link.label }}</a></li>
        }
      </ul>
    </nav>
    <a class="btn btn--primary" [href]="resumePath" download (click)="closeMenu()">Download Resume</a>
  </div>

  @if (isMenuOpen()) {
    <button type="button" class="mobile-nav__scrim" aria-label="Close menu" (click)="closeMenu()"></button>
  }
</header>

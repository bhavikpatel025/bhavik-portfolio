<section class="about" id="about" aria-labelledby="about-heading">
  <div class="container about__inner">
    <app-section-heading
      eyebrow="About"
      title="Backend-first, frontend-considered."
      class="about__heading"
    />

    <div class="about__body" appReveal>
      @for (paragraph of about; track $index) {
        <p>{{ paragraph }}</p>
      }
    </div>
  </div>
</section>
